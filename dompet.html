<!DOCTYPE html>
<html lang="id">
<head><!-- PLAYABLE_TOUCH_PATCH_V1 --><script>
(function() {
  if (window.__playableTouchPatchInstalled) return;
  window.__playableTouchPatchInstalled = true;
  var origAdd = EventTarget.prototype.addEventListener;
  var blockedTypes = { touchstart: 1, touchmove: 1, wheel: 1 };
  EventTarget.prototype.addEventListener = function(type, listener, options) {
    if (blockedTypes[type]) {
      if (options === undefined || options === null) {
        options = { passive: true };
      } else if (typeof options === 'boolean') {
        options = { capture: options, passive: true };
      } else {
        options = Object.assign({}, options, { passive: true });

    return origAdd.call(this, type, listener, options);
  };

</script><script>window.Intl=window.Intl||{};Intl.t=function(s){return(Intl._locale&&Intl._locale[s])||s;};</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Dompet Pelajar - Aplikasi Pencatatan Keuangan</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{width:100%;overflow-x:hidden;background:#f0fdf4;color:#0f172a}
:root{--green:#10b981;--green2:#059669;--border:#dcfce7}
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:12px 14px;display:flex;align-items:center;justify-content:space-between}
.topbar b{font-size:15px} .topbar b span{color:var(--green)}
.hamburger{width:40px;height:40px;border-radius:12px;background:#fff;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer}
.wrap{padding:14px;max-width:500px;margin:0 auto;width:100%}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{0%{transform:scale(.96);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes pulseFab{0%{box-shadow:0 8px 24px rgba(16,185,129,.4)}50%{box-shadow:0 8px 28px rgba(16,185,129,.55),0 0 0 8px rgba(16,185,129,.12)}100%{box-shadow:0 8px 24px rgba(16,185,129,.4)}}
.saldo-card{background:linear-gradient(135deg,#10b981 0%,#34d399 100%);border-radius:24px;padding:20px;color:#fff;position:relative;overflow:hidden;margin-bottom:14px;animation:popIn .4s ease both}
.saldo-card::after{content:"";position:absolute;width:180px;height:180px;background:rgba(255,255,255,.15);border-radius:50%;top:-40px;right:-40px}
.saldo-label{font-size:11px;opacity:.9;font-weight:700;letter-spacing:.8px} .saldo-amount{font-size:28px;font-weight:900;margin-top:4px}
.saldo-stats{display:flex;gap:10px;margin-top:16px}
.mini-stat{flex:1;background:rgba(255,255,255,.18);backdrop-filter:blur(10px);border-radius:14px;padding:10px 12px}
.mini-stat b{display:block;font-size:11px;opacity:.9} .mini-stat span{font-size:15px;font-weight:800}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none} .chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:8px 14px;border-radius:20px;border:1.5px solid var(--border);background:#fff;font-size:12px;font-weight:600;flex-shrink:0;cursor:pointer;transition:.2s}
.chip.active{background:var(--green);color:#fff;border-color:var(--green)}
/* FAB - FIX Z-INDEX BIAR MUNCUL */
.fab{position:fixed;bottom:20px;right:16px;width:56px;height:56px;border-radius:50%;background:var(--green);color:#fff;border:none;font-size:26px;box-shadow:0 8px 24px rgba(16,185,129,.4);z-index:110;cursor:pointer;display:flex;align-items:center;justify-content:center;animation:pulseFab 2.5s infinite}
.fab:active{transform:scale(.94)}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:#fff;border:1px solid var(--border);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px;animation:fadeUp .35s ease both}
.item-icon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px}
.item-icon.in{background:#dcfce7;color:#059669} .item-icon.out{background:#fee2e2;color:#dc2626}
.item-main{flex:1;min-width:0} .item-main h4{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .item-main p{font-size:11px;color:#64748b;margin-top:2px}
.item-amount{font-weight:800;font-size:14px} .item-amount.in{color:#059669} .item-amount.out{color:#dc2626}
.item-del{margin-left:6px;width:24px;height:24px;border-radius:50%;border:none;background:#f1f5f9;color:#94a3b8;font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.popup{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);z-index:200;display:none;align-items:flex-end}
.popup.active{display:flex} @media(min-width:600px){.popup{justify-content:center;align-items:center;padding:20px}}
.sheet{background:#fff;width:100%;max-width:420px;border-radius:24px 24px 0 0;overflow:auto;max-height:92vh;animation:slideUp .35s cubic-bezier(.16,1,.3,1)}
@media(min-width:600px){.sheet{border-radius:24px}}
.sheet-head{padding:18px 18px 0;display:flex;justify-content:space-between;align-items:center}
.sheet-body{padding:18px}
.input{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid #e2e8f0;background:#f8fafc;outline:none;font-size:14px;margin-top:8px}
.input:focus{border-color:var(--green);background:#fff}
.type-tabs{display:flex;gap:6px;background:#f1f5f9;padding:4px;border-radius:12px;margin-bottom:14px}
.type-tabs button{flex:1;padding:10px;border-radius:10px;border:none;font-weight:700;font-size:13px;cursor:pointer;background:transparent}
.type-tabs button.active{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08);color:var(--green)}
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.cat-btn{padding:10px 6px;border-radius:12px;border:1.5px solid var(--border);background:#fff;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.cat-btn i{font-size:20px} .cat-btn.active{border-color:var(--green);background:#f0fdf4;color:var(--green)}
.btn-save{width:100%;padding:14px;border-radius:14px;border:none;background:var(--green);color:#fff;font-weight:800;font-size:14px;margin-top:16px;cursor:pointer}
/* SIDEBAR - FIX */
.sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);z-index:90;display:none}
.sidebar-overlay.active{display:block}
.sidebar{position:fixed;top:0;left:0;bottom:0;width:280px;max-width:85vw;background:#fff;z-index:100;border-right:1px solid var(--border);transform:translateX(-100%);transition:transform .35s cubic-bezier(.16,1,.3,1);display:flex;flex-direction:column}
.sidebar.active{transform:translateX(0)}
.side-head{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
.side-head b{font-size:16px} .side-head b span{color:var(--green)}
.side-menu{flex:1;overflow:auto;padding:12px}
.side-label{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#999;font-weight:800;margin:16px 0 8px 8px}
.side-item{width:100%;text-align:left;padding:12px 14px;border-radius:12px;border:none;background:transparent;font-size:14px;font-weight:600;display:flex;align-items:center;gap:12px;cursor:pointer;color:#333}
.side-item i{font-size:18px;color:#888} .side-item:hover{background:#f0fdf4}
.side-item.active{background:#dcfce7;color:var(--green2)}
.side-bottom{padding:14px;border-top:1px solid var(--border);background:#fff}
.side-back{display:flex;align-items:center;gap:8px;padding:12px 14px;background:#0f172a;color:#fff;border-radius:12px;text-decoration:none;font-weight:700;font-size:13px;justify-content:center}
.side-footer{font-size:10px;color:#aaa;text-align:center;margin-top:10px}
.empty{text-align:center;padding:40px;color:#aaa}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 20px;border-radius:30px;font-size:13px;font-weight:600;z-index:120;display:none}
</style>
</head>
<body>

<div class="topbar">
  <div style="display:flex;align-items:center;gap:10px">
    <button class="hamburger" id="menu-btn"><i class="ri-menu-3-line"></i></button>
    <b>DOMPET<span>PELAJAR</span></b>
  </div>
  <button class="hamburger" onclick="setFilter('today')"><i class="ri-calendar-line"></i></button>
</div>

<div id="sidebar-overlay" class="sidebar-overlay"></div>
<div id="sidebar" class="sidebar">
  <div class="side-head"><b>DOMPET<span>PELAJAR</span></b><button class="hamburger" id="close-menu"><i class="ri-close-line"></i></button></div>
  <div class="side-menu">
    <p class="side-label">Menu</p>
    <button class="side-item active" data-action="dashboard"><i class="ri-dashboard-line"></i> Dashboard</button>
    <button class="side-item" data-action="all"><i class="ri-list-check"></i> Semua Transaksi</button>
    <button class="side-item" data-action="in"><i class="ri-arrow-up-line"></i> Pemasukan</button>
    <button class="side-item" data-action="out"><i class="ri-arrow-down-line"></i> Pengeluaran</button>
    <p class="side-label">Laporan</p>
    <button class="side-item" data-action="today"><i class="ri-calendar-line"></i> Hari Ini</button>
    <button class="side-item" data-action="week"><i class="ri-calendar-week-line"></i> Minggu Ini</button>
    <button class="side-item" data-action="target"><i class="ri-flag-line"></i> Target Tabungan</button>
  </div>
  <div class="side-bottom">
    <a href="index.html" class="side-back"><i class="ri-arrow-left-line"></i> Kembali ke Portfolio</a>
    <div class="side-footer">© 2026 • yaegarrdev.netlify.app/dompet.html</div>
  </div>
</div>

<div class="wrap">
  <div class="saldo-card">
    <div class="saldo-label">SALDO SAAT INI</div>
    <div class="saldo-amount" id="saldo">Rp 0</div>
    <div class="saldo-stats">
      <div class="mini-stat"><b>↗ Masuk</b><span id="total-in">Rp 0</span></div>
      <div class="mini-stat"><b>↘ Keluar</b><span id="total-out">Rp 0</span></div>
    </div>
  </div>
  <div class="chips" id="chips"></div>
  <div class="list" id="list"></div>
  <div id="empty" class="empty"><i class="ri-wallet-3-line" style="font-size:40px"></i><p style="margin-top:8px">Belum ada transaksi yang tercatat<br><span style="font-size:12px">Pencet + buat tambah</span></p></div>
</div>

<button class="fab" id="fab"><i class="ri-add-line"></i></button>

<div class="popup" id="popup">
  <div class="sheet">
    <div class="sheet-head"><h3>Tambah Transaksi</h3><button class="hamburger" id="close-popup" style="width:36px;height:36px"><i class="ri-close-line"></i></button></div>
    <div class="sheet-body">
      <div class="type-tabs"><button id="tab-out" class="active"><i class="ri-arrow-down-line"></i> Keluar</button><button id="tab-in"><i class="ri-arrow-up-line"></i> Masuk</button></div>
      <label style="font-size:12px;font-weight:700;color:#64748b">JUMLAH</label>
      <input id="amount" class="input" type="number" inputmode="numeric" placeholder="Contoh: 15000">
      <label style="font-size:12px;font-weight:700;color:#64748b;margin-top:12px;display:block">KETERANGAN</label>
      <input id="note" class="input" type="text" placeholder="Contoh: Uang saku mingguan">
      <label style="font-size:12px;font-weight:700;color:#64748b;margin-top:12px;display:block">KATEGORI</label>
      <div class="cat-grid" id="cat-grid"></div>
      <button class="btn-save" id="save-btn">Simpan Transaksi</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let transactions = JSON.parse(localStorage.getItem("dompet_trans")||"[]");
let filter="all", type="out", selectedCat="Jajan";
const cats={out:[{id:"Jajan",icon:"ri-restaurant-line"},{id:"Transport",icon:"ri-bus-line"},{id:"Pulsa",icon:"ri-smartphone-line"},{id:"Sekolah",icon:"ri-book-line"},{id:"Makanan",icon:"ri-bowl-line"},{id:"Game",icon:"ri-gamepad-line"},{id:"Lainnya",icon:"ri-more-line"}],in:[{id:"Saku",icon:"ri-hand-coin-line"},{id:"Jualan",icon:"ri-store-line"},{id:"Freelance",icon:"ri-code-line"},{id:"Hadiah",icon:"ri-gift-line"},{id:"Lainnya",icon:"ri-more-line"}]};
const saldoEl=document.getElementById("saldo"), listEl=document.getElementById("list"), emptyEl=document.getElementById("empty"), chipsEl=document.getElementById("chips"), popup=document.getElementById("popup"), fab=document.getElementById("fab"), sidebar=document.getElementById("sidebar"), overlay=document.getElementById("sidebar-overlay");
function openSidebar(){sidebar.classList.add("active"); overlay.classList.add("active"); document.body.style.overflow="hidden"}
function closeSidebar(){sidebar.classList.remove("active"); overlay.classList.remove("active"); document.body.style.overflow=""}
document.getElementById("menu-btn").addEventListener("click",openSidebar);
document.getElementById("close-menu").addEventListener("click",closeSidebar);
overlay.addEventListener("click",closeSidebar);
function formatRp(n){return "Rp "+n.toLocaleString("id-ID")}
function getFiltered(){let list=[...transactions].sort((a,b)=>b.ts-a.ts); if(filter==="in") list=list.filter(t=>t.type==="in"); if(filter==="out") list=list.filter(t=>t.type==="out"); if(filter==="today"){const today=new Date().toDateString(); list=list.filter(t=>new Date(t.ts).toDateString()===today);} if(filter==="week"){const now=Date.now(); list=list.filter(t=> now - t.ts < 7*24*60*60*1000);} return list;}
function renderChips(){const chips=[{id:"all",label:"Semua"},{id:"today",label:"Hari Ini"},{id:"week",label:"Minggu Ini"},{id:"in",label:"Masuk"},{id:"out",label:"Keluar"}]; chipsEl.innerHTML=chips.map(c=>`<div class="chip ${filter===c.id?'active':''}" data-f="${c.id}">${c.label}</div>`).join(""); chipsEl.querySelectorAll(".chip").forEach(ch=>ch.addEventListener("click",()=>{filter=ch.dataset.f; render();}));}
function render(){const filtered=getFiltered(); const totalIn=transactions.filter(t=>t.type==="in").reduce((a,b)=>a+b.amount,0); const totalOut=transactions.filter(t=>t.type==="out").reduce((a,b)=>a+b.amount,0); const saldo=totalIn-totalOut; saldoEl.textContent=formatRp(saldo); document.getElementById("total-in").textContent=formatRp(totalIn); document.getElementById("total-out").textContent=formatRp(totalOut); renderChips(); if(filtered.length===0){listEl.innerHTML=""; emptyEl.style.display="block"; return;} emptyEl.style.display="none"; listEl.innerHTML=filtered.map((t,i)=>{const d=new Date(t.ts); const time=d.toLocaleDateString("id-ID",{day:"2-digit",month:"short"})+" • "+d.toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"}); const icon=cats[t.type==='in'?'in':'out'].find(c=>c.id===t.cat)?.icon||'ri-money-dollar-circle-line'; return `<div class="item" style="animation-delay:${(i*0.04).toFixed(2)}s"><div class="item-icon ${t.type}"><i class="${icon}"></i></div><div class="item-main"><h4>${t.note||t.cat}</h4><p>${t.cat} • ${time}</p></div><div class="item-amount ${t.type}">${t.type==='in'?'+':'-'}${formatRp(t.amount)}</div><button class="item-del" onclick="deleteTrans(${t.id})"><i class="ri-close-line"></i></button></div>`;}).join("");}
function renderCats(){const grid=document.getElementById("cat-grid"); const list=cats[type]; grid.innerHTML=list.map(c=>`<button class="cat-btn ${selectedCat===c.id?'active':''}" data-cat="${c.id}"><i class="${c.icon}"></i>${c.id}</button>`).join(""); grid.querySelectorAll(".cat-btn").forEach(b=>b.addEventListener("click",()=>{selectedCat=b.dataset.cat; renderCats();}));}
function openForm(){document.getElementById("amount").value=""; document.getElementById("note").value=""; type="out"; selectedCat="Jajan"; document.getElementById("tab-out").classList.add("active"); document.getElementById("tab-in").classList.remove("active"); renderCats(); popup.classList.add("active");}
function closeForm(){popup.classList.remove("active")}
function saveTrans(){const amount=parseInt(document.getElementById("amount").value); const note=document.getElementById("note").value.trim(); if(!amount||amount<=0){showToast("Silakan masukkan jumlah yang valid"); return;} transactions.push({id:Date.now(), amount, note:note||selectedCat, cat:selectedCat, type, ts:Date.now()}); localStorage.setItem("dompet_trans",JSON.stringify(transactions)); closeForm(); render(); showToast("Transaksi berhasil disimpan");}
function deleteTrans(id){if(!confirm("Hapus transaksi ini?")) return; transactions=transactions.filter(t=>t.id!==id); localStorage.setItem("dompet_trans",JSON.stringify(transactions)); render(); showToast("Transaksi dihapus");}
function setFilter(f){filter=f; render(); closeSidebar();}
document.getElementById("tab-out").addEventListener("click",()=>{type="out"; selectedCat="Jajan"; document.getElementById("tab-out").classList.add("active"); document.getElementById("tab-in").classList.remove("active"); renderCats();});
document.getElementById("tab-in").addEventListener("click",()=>{type="in"; selectedCat="Saku"; document.getElementById("tab-in").classList.add("active"); document.getElementById("tab-out").classList.remove("active"); renderCats();});
fab.addEventListener("click",openForm);
document.getElementById("close-popup").addEventListener("click",closeForm);
document.getElementById("save-btn").addEventListener("click",saveTrans);
popup.addEventListener("click",e=>{if(e.target===popup) closeForm()});
document.querySelectorAll(".side-item").forEach(item=>{item.addEventListener("click",()=>{const act=item.dataset.action; document.querySelectorAll(".side-item").forEach(i=>i.classList.remove("active")); item.classList.add("active"); if(act==="dashboard"||act==="all") filter="all"; if(act==="in") filter="in"; if(act==="out") filter="out"; if(act==="today") filter="today"; if(act==="week") filter="week"; if(act==="target"){showToast("Target coming soon!"); return;} render(); closeSidebar();});});
function showToast(msg){const t=document.getElementById("toast"); t.textContent=msg; t.style.display="block"; setTimeout(()=>t.style.display="none",2000)}
renderCats(); render();
</script>
</body>
</html>
