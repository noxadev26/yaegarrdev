<html lang="id">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Jadwal Pelajaran - Kelas 10 TKJ SMK PGRI 6 Ngawi</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{width:100%;overflow-x:hidden;background:#f8fafc;color:#0f172a}
:root{--blue:#2563eb;--border:#e2e8f0}
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:12px 14px;display:flex;align-items:center;justify-content:space-between}
.topbar b{font-size:15px} .topbar b span{color:var(--blue)}
.hamburger{width:40px;height:40px;border-radius:12px;background:#fff;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer}
.wrap{padding:14px;max-width:600px;margin:0 auto;width:100%}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{0%{transform:scale(.96);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.hero{background:linear-gradient(135deg,#2563eb 0%,#60a5fa 100%);border-radius:20px;padding:18px 20px;color:#fff;position:relative;overflow:hidden;margin-bottom:14px;animation:popIn .4s ease both}
.hero h2{font-size:18px} .hero p{font-size:12px;opacity:.9;margin-top:4px}
.hero::after{content:"";position:absolute;width:200px;height:200px;background:rgba(255,255,255,.12);border-radius:50%;top:-50px;right:-50px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none;margin-bottom:6px} .tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;padding:9px 16px;border-radius:20px;border:1.5px solid var(--border);background:#fff;font-size:12px;font-weight:700;cursor:pointer;transition:.2s}
.tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:10px;animation:fadeUp .35s ease both;transition:.2s}
.card:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(0,0,0,.06)}
.card.today{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.jadwal-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid #f1f5f9}
.jadwal-item:last-child{border:none}
.jam{font-size:11px;font-weight:800;color:#64748b;min-width:70px}
.mapel{flex:1} .mapel b{font-size:13px;display:block} .mapel span{font-size:11px;color:#64748b}
.guru{font-size:11px;color:var(--blue);font-weight:600;margin-top:2px}
.badge{padding:3px 8px;border-radius:20px;font-size:10px;font-weight:700;background:#dbeafe;color:var(--blue)}
.piket{display:flex;align-items:center;gap:10px;padding:8px 0}
.piket input{width:18px;height:18px;accent-color:var(--blue)}
.piket.done{opacity:.6} .piket.done b{text-decoration:line-through}
.fab{position:fixed;bottom:20px;right:16px;width:56px;height:56px;border-radius:50%;background:var(--blue);color:#fff;border:none;font-size:24px;z-index:110;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(37,99,235,.35);cursor:pointer}
.popup{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);z-index:200;display:none;align-items:flex-end}
.popup.active{display:flex} @media(min-width:600px){.popup{justify-content:center;align-items:center;padding:20px}}
.sheet{background:#fff;width:100%;max-width:420px;border-radius:24px 24px 0 0;overflow:auto;max-height:90vh;animation:slideUp .35s cubic-bezier(.16,1,.3,1)}
@media(min-width:600px){.sheet{border-radius:24px}}
.sheet-head{padding:18px 18px 0;display:flex;justify-content:space-between;align-items:center}
.sheet-body{padding:18px}
.input{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid #e2e8f0;background:#f8fafc;outline:none;font-size:14px;margin-top:8px}
.input:focus{border-color:var(--blue);background:#fff}
.btn-save{width:100%;padding:14px;border-radius:14px;border:none;background:var(--blue);color:#fff;font-weight:800;margin-top:16px;cursor:pointer}
.sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);z-index:90;display:none}
.sidebar-overlay.active{display:block}
.sidebar{position:fixed;top:0;left:0;bottom:0;width:280px;max-width:85vw;background:#fff;z-index:100;border-right:1px solid var(--border);transform:translateX(-100%);transition:transform .35s cubic-bezier(.16,1,.3,1);display:flex;flex-direction:column}
.sidebar.active{transform:translateX(0)}
.side-head{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
.side-head b{font-size:16px} .side-head b span{color:var(--blue)}
.side-menu{flex:1;overflow:auto;padding:12px}
.side-label{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#999;font-weight:800;margin:16px 0 8px 8px}
.side-item{width:100%;text-align:left;padding:12px 14px;border-radius:12px;border:none;background:transparent;font-size:14px;font-weight:600;display:flex;align-items:center;gap:12px;cursor:pointer;color:#333}
.side-item i{font-size:18px;color:#888} .side-item:hover{background:#eff6ff}
.side-item.active{background:#dbeafe;color:#1d4ed8}
.side-bottom{padding:14px;border-top:1px solid var(--border);background:#fff}
.side-back{display:flex;align-items:center;gap:8px;padding:12px 14px;background:#0f172a;color:#fff;border-radius:12px;text-decoration:none;font-weight:700;font-size:13px;justify-content:center}
.side-footer{font-size:10px;color:#aaa;text-align:center;margin-top:10px}
.empty{text-align:center;padding:30px;color:#aaa}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 20px;border-radius:30px;font-size:13px;font-weight:600;z-index:120;display:none}
</style>
</head>
<body>

<div class="topbar">
  <div style="display:flex;align-items:center;gap:10px">
    <button class="hamburger" id="menu-btn"><i class="ri-menu-3-line"></i></button>
    <b>JADWAL<span>PELAJARAN</span></b>
  </div>
  <button class="hamburger" id="today-btn"><i class="ri-calendar-check-line"></i></button>
</div>

<div id="sidebar-overlay" class="sidebar-overlay"></div>
<div id="sidebar" class="sidebar">
  <div class="side-head"><b>JADWAL<span>PELAJARAN</span></b><button class="hamburger" id="close-menu"><i class="ri-close-line"></i></button></div>
  <div class="side-menu">
    <p class="side-label">Menu</p>
    <button class="side-item active" data-day="today"><i class="ri-star-line"></i> Hari Ini</button>
    <button class="side-item" data-day="Senin"><i class="ri-calendar-line"></i> Senin</button>
    <button class="side-item" data-day="Selasa"><i class="ri-calendar-line"></i> Selasa</button>
    <button class="side-item" data-day="Rabu"><i class="ri-calendar-line"></i> Rabu</button>
    <button class="side-item" data-day="Kamis"><i class="ri-calendar-line"></i> Kamis</button>
    <button class="side-item" data-day="Jumat"><i class="ri-calendar-line"></i> Jumat</button>
    <p class="side-label">Lainnya</p>
    <button class="side-item" data-action="piket" style="opacity:.6"><i class="ri-brush-4-line"></i> Piket <span style="background:#f59e0b;color:#fff;padding:2px 6px;border-radius:6px;font-size:9px;margin-left:4px">Segera Hadir</span></button>
    <button class="side-item" data-action="reset"><i class="ri-refresh-line"></i> Reset ke Default TKJ</button>
    <button class="side-item" data-action="tugas" style="opacity:.6"><i class="ri-task-line"></i> Tugas <span style="background:#e2e8f0;color:#64748b;padding:2px 6px;border-radius:6px;font-size:9px;margin-left:4px">Segera Hadir</span></button>
  </div>
  <div class="side-bottom">
    <a href="index.html" class="side-back"><i class="ri-arrow-left-line"></i> Kembali ke Portfolio</a>
    <div class="side-footer">© 2026 • yaegarrdev.netlify.app/jadwal.html</div>
  </div>
</div>

<div class="wrap">
  <div class="hero" id="hero">
    <div><h2 id="hero-day">Senin</h2><p id="hero-date">Loading...</p><p style="font-size:10px;opacity:.8;margin-top:2px">Kelas 10 TKJ • SMK PGRI 6 Ngawi</p></div>
    <div style="font-size:40px;opacity:.3"><i class="ri-book-open-line"></i></div>
  </div>

  <div class="tabs" id="day-tabs"></div>

  <div id="content"></div>
</div>

<button class="fab" id="fab"><i class="ri-add-line"></i></button>

<div class="popup" id="popup">
  <div class="sheet">
    <div class="sheet-head"><h3 id="form-title">Tambah Mata Pelajaran</h3><button class="hamburger" id="close-popup" style="width:36px;height:36px"><i class="ri-close-line"></i></button></div>
    <div class="sheet-body">
      <label style="font-size:11px;font-weight:800;color:#64748b">JAM</label>
      <input id="f-jam" class="input" placeholder="07:00 - 08:30">
      <label style="font-size:11px;font-weight:800;color:#64748b;margin-top:12px;display:block">MATA PELAJARAN</label>
      <input id="f-mapel" class="input" placeholder="TKJ - Jaringan Dasar">
      <label style="font-size:11px;font-weight:800;color:#64748b;margin-top:12px;display:block">GURU / RUANG</label>
      <input id="f-guru" class="input" placeholder="Pak Budi - Lab 2">
      <button class="btn-save" id="save-btn">Simpan Jadwal</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const defaultJadwal = {
  Senin: [
    {jam:"07:00 - 08:30",mapel:"PJOK",guru:"Lisnadi"},
    {jam:"08:30 - 10:00",mapel:"MTK",guru:"Susi Setyowati"},
    {jam:"10:15 - 11:45",mapel:"B.Jawa",guru:"Bheini Ardeyana S"},
    {jam:"12:30 - 14:00",mapel:"Pro TKJ",guru:"Wahyudi"}
  ],
  Selasa: [
    {jam:"07:00 - 08:30",mapel:"IPAS",guru:"Fuadi Susilo"},
    {jam:"08:30 - 10:00",mapel:"MTK",guru:"Susi Setyowati"},
    {jam:"10:15 - 11:15",mapel:"Seni Budaya",guru:"Syarofiati"},
    {jam:"11:15 - 14:00",mapel:"Pro TKJ",guru:"Elsa Novia A"}
  ],
  Rabu: [
    {jam:"07:00 - 08:30",mapel:"IPAS",guru:"Fuadi Susilo"},
    {jam:"08:30 - 10:30",mapel:"Informatika",guru:"Wahyudi"},
    {jam:"10:45 - 12:15",mapel:"B.Indo",guru:"Nur Fita Arismawati"}
  ],
  Kamis: [
    {jam:"07:00 - 08:30",mapel:"B.Inggris",guru:"Febti Dian E"},
    {jam:"08:30 - 10:00",mapel:"MTK",guru:"Susi Setyowati"},
    {jam:"10:15 - 11:15",mapel:"B.Jawa",guru:"Bheini Ardeyana S"},
    {jam:"11:15 - 14:00",mapel:"Pro TKJ",guru:"Wahyudi"}
  ],
  Jumat: [
    {jam:"07:00 - 09:00",mapel:"PAI",guru:"Amilia Kurniasari"},
    {jam:"09:00 - 10:30",mapel:"PKN",guru:"Khairudin"}
  ]
};

let jadwal = JSON.parse(localStorage.getItem("jadwal_kelas10_tkj")||"null") || JSON.parse(JSON.stringify(defaultJadwal));
let currentDay = new Date().toLocaleDateString('id-ID',{weekday:'long'});
currentDay = currentDay.charAt(0).toUpperCase()+currentDay.slice(1);
if(!jadwal[currentDay]) currentDay="Senin";
let activeDay=currentDay;

const heroDay=document.getElementById("hero-day");
const heroDate=document.getElementById("hero-date");
const content=document.getElementById("content");
const dayTabs=document.getElementById("day-tabs");
const sidebar=document.getElementById("sidebar");
const overlay=document.getElementById("sidebar-overlay");
const popup=document.getElementById("popup");

function openSidebar(){sidebar.classList.add("active"); overlay.classList.add("active"); document.body.style.overflow="hidden"}
function closeSidebar(){sidebar.classList.remove("active"); overlay.classList.remove("active"); document.body.style.overflow=""}
document.getElementById("menu-btn").addEventListener("click",openSidebar);
document.getElementById("close-menu").addEventListener("click",closeSidebar);
overlay.addEventListener("click",closeSidebar);

function saveToStorage(){localStorage.setItem("jadwal_kelas10_tkj",JSON.stringify(jadwal));}

function resetToDefault(){
  if(!confirm("Atur ulang jadwal ke default? Semua jadwal tambahan akan dihapus.")) return;
  localStorage.removeItem("jadwal_kelas10_tkj");
  jadwal = JSON.parse(JSON.stringify(defaultJadwal));
  saveToStorage();
  render(); renderTabs();
  showToast("Jadwal berhasil diatur ulang ke default");
}

function renderTabs(){
  const days=["Senin","Selasa","Rabu","Kamis","Jumat"];
  dayTabs.innerHTML=days.map(d=>`<div class="tab ${activeDay===d?'active':''}" data-day="${d}">${d}${d===currentDay?' • Hari Ini':''}</div>`).join("");
  dayTabs.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{activeDay=t.dataset.day; render(); renderTabs();}));
}

function render(){
  heroDay.textContent = activeDay;
  heroDate.textContent = new Date().toLocaleDateString('id-ID',{weekday:'long', day:'numeric', month:'long', year:'numeric'}) + (activeDay===currentDay ? " • Hari ini" : "") + " • Kelas 10 TKJ - SMK PGRI 6 Ngawi";
  
  const list=jadwal[activeDay]||[];
  if(list.length===0){
    content.innerHTML=`<div class="empty"><i class="ri-calendar-close-line" style="font-size:36px"></i><p style="margin-top:8px">Belum ada jadwal ${activeDay}</p><p style="font-size:12px;margin-top:6px">Gunakan tombol tambah untuk menambahkan jadwal baru</p><button onclick="resetToDefault()" style="margin-top:14px;padding:10px 16px;border-radius:10px;border:1.5px solid #e2e8f0;background:#fff;font-weight:700;font-size:12px"><i class="ri-refresh-line"></i> Reset ke Default</button></div>`;
    return;
  }
  content.innerHTML = `<div class="card ${activeDay===currentDay?'today':''}">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <h4 style="font-size:14px">${activeDay} ${activeDay===currentDay?'<span style="background:#2563eb;color:#fff;padding:2px 8px;border-radius:10px;font-size:10px;margin-left:6px">HARI INI</span>':''}</h4>
      <div style="display:flex;gap:6px;align-items:center">
        <span class="badge">${list.length} mapel</span>
        <button onclick="resetToDefault()" title="Reset ke default" style="width:32px;height:32px;border-radius:8px;border:1px solid #e2e8f0;background:#fff;display:flex;align-items:center;justify-content:center;font-size:16px"><i class="ri-refresh-line"></i></button>
      </div>
    </div>` + list.map((j,i)=>`<div class="jadwal-item" style="animation:fadeUp .3s ease both;animation-delay:${(i*0.04).toFixed(2)}s">
      <div class="jam">${j.jam}</div>
      <div class="mapel"><b>${j.mapel}</b><div class="guru">${j.guru}</div></div>
      <button onclick="deleteMapel(${i})" style="width:32px;height:32px;border-radius:8px;border:1px solid #fee2e2;background:#fff;color:#ef4444;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0" title="Hapus"><i class="ri-delete-bin-line"></i></button>
    </div>`).join("") + `</div>
    <div style="display:flex;gap:8px;margin-top:10px">
      <button onclick="openForm()" style="flex:1;padding:12px;border-radius:12px;border:1.5px dashed #cbd5e1;background:#fff;font-weight:700;font-size:12px;color:#64748b"><i class="ri-add-line"></i> Tambah Mapel</button>
      <button onclick="resetToDefault()" style="padding:12px 16px;border-radius:12px;border:1px solid #e2e8f0;background:#fff;font-weight:700;font-size:12px;color:#475569"><i class="ri-refresh-line"></i> Reset</button>
    </div>`;
}

function openForm(){document.getElementById("f-jam").value=""; document.getElementById("f-mapel").value=""; document.getElementById("f-guru").value=""; popup.classList.add("active");}
function closeForm(){popup.classList.remove("active")}
function saveMapel(){
  const jam=document.getElementById("f-jam").value.trim();
  const mapel=document.getElementById("f-mapel").value.trim();
  const guru=document.getElementById("f-guru").value.trim();
  if(!jam||!mapel){showToast("Lengkapi jam dan mata pelajaran"); return;}
  if(!jadwal[activeDay]) jadwal[activeDay]=[];
  jadwal[activeDay].push({jam,mapel,guru: guru||"Guru tidak diisi"});
  saveToStorage();
  closeForm(); render(); showToast("Jadwal berhasil ditambahkan");
}
function deleteMapel(i){
  if(!confirm("Hapus mata pelajaran ini?")) return; 
  jadwal[activeDay].splice(i,1); 
  saveToStorage(); 
  render(); 
  showToast("Mata pelajaran dihapus");
}

document.getElementById("fab").addEventListener("click",openForm);
document.getElementById("close-popup").addEventListener("click",closeForm);
document.getElementById("save-btn").addEventListener("click",saveMapel);
popup.addEventListener("click",e=>{if(e.target===popup) closeForm()});
document.getElementById("today-btn").addEventListener("click",()=>{activeDay=currentDay; render(); renderTabs(); showToast("Menampilkan jadwal hari ini");});
document.querySelectorAll(".side-item").forEach(item=>{
  item.addEventListener("click",()=>{
    const day=item.dataset.day;
    const act=item.dataset.action;
    document.querySelectorAll(".side-item").forEach(i=>i.classList.remove("active"));
    item.classList.add("active");
    if(day){activeDay=day; render(); renderTabs();}
    if(act==="piket"){
      showToast("Fitur daftar piket sedang dalam pengembangan");
      // tampilkan coming soon UI
      heroDay.textContent="Daftar Piket - Segera Hadir";
      heroDate.textContent="Fitur ini sedang dalam tahap pengembangan";
      content.innerHTML=`<div class="card" style="text-align:center;padding:30px">
        <div style="width:60px;height:60px;background:#fef3c7;border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:28px">🚧</div>
        <h3 style="font-size:16px">Daftar Piket - Segera Hadir</h3>
        <p style="font-size:12px;color:#64748b;margin-top:6px">Fitur daftar piket sedang dikembangkan untuk melengkapi aplikasi jadwal pelajaran.</p>
        <button onclick="setActiveDayToToday()" style="margin-top:16px;padding:10px 16px;border-radius:10px;border:none;background:#2563eb;color:#fff;font-weight:700;font-size:12px">Kembali ke Jadwal</button>
      </div>`;
    }
    if(act==="reset"){resetToDefault();}
    if(act==="tugas"){showToast("Fitur tugas akan segera hadir");}
    closeSidebar();
  });
});
function setActiveDayToToday(){activeDay=currentDay; render(); renderTabs(); document.querySelectorAll(".side-item").forEach(i=>i.classList.remove("active")); document.querySelector('[data-day="today"]')?.classList.add("active");}
function showToast(msg){const t=document.getElementById("toast"); t.textContent=msg; t.style.display="block"; setTimeout(()=>t.style.display="none",2500)}
renderTabs(); render();
</script>
</body>
</html>
