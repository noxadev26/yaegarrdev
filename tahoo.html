let search="", kat="Semua", page="home", sel=null, tab="bahan";
let fav=JSON.parse(localStorage.getItem("tahoo_fav")||"[]");
const grid=document.getElementById("grid"), chipsEl=document.getElementById("chips"), searchEl=document.getElementById("search"), popup=document.getElementById("popup"), sidebar=document.getElementById("sidebar"), overlay=document.getElementById("sidebar-overlay");
function openSidebar(){sidebar.classList.add("active"); overlay.classList.add("active"); document.body.style.overflow="hidden"}
function closeSidebar(){sidebar.classList.remove("active"); overlay.classList.remove("active"); document.body.style.overflow=""}
document.getElementById("menu-btn").addEventListener("click",openSidebar);

overlay.addEventListener("click",closeSidebar);
function updateFavCount(){const el=document.getElementById("fav-count-side"); if(el){el.textContent=fav.length; el.style.display=fav.length?"inline-block":"none"}}
function renderChips(){const cats=["Semua","Ayam","Nasi","Mie","Tahu","Tempe","Sayur","Daging","Telur","Dessert"]; chipsEl.innerHTML=cats.map(c=>`<div class="chip ${kat===c?'active':''}" data-c="${c}">${c}</div>`).join(""); chipsEl.querySelectorAll(".chip").forEach(ch=>ch.addEventListener("click",()=>{kat=ch.dataset.c; render()}));}
function getFiltered(){let list=page==="fav"? allResep.filter(r=>fav.includes(r.id)) : allResep; return list.filter(r=>(kat==="Semua"||r.kat===kat)&&r.nama.toLowerCase().includes(search.toLowerCase()));}
function render(){const filtered=getFiltered(); if(page==="fav"){document.getElementById("hero").innerHTML=` <div><h2>Resep Tersimpan</h2><p>${fav.length} resep tersimpan</p></div><div style="font-size:32px;opacity:.4">🔖</div>`} else {document.getElementById("hero").innerHTML=`<div><h2>Katalog Resep Masakan</h2><p>${allResep.length} resep pilihan dengan panduan lengkap</p></div><div style="font-size:32px;opacity:.4">🍳</div>`} renderChips(); grid.innerHTML=filtered.map(r=>{const isFav=fav.includes(r.id); return `<div class="card" data-id="${r.id}"><span class="badge-time">${r.waktu}</span><button class="fav ${isFav?'active':''}" data-fav="${r.id}"><i class="${isFav?'ri-heart-3-fill':'ri-heart-3-line'}"></i></button><img src="${r.foto}" loading="lazy"><div class="card-body"><h3>${r.nama}</h3><div class="meta">⭐ ${r.level} • ${r.kal} kkal</div></div></div>`;}).join(""); document.getElementById("empty").style.display=filtered.length?"none":"block"; grid.querySelectorAll(".card").forEach(c=>c.addEventListener("click",e=>{if(e.target.closest(".fav")) return; openDetail(parseInt(c.dataset.id))})); grid.querySelectorAll(".fav").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation(); toggleFav(parseInt(b.dataset.fav))})); updateFavCount();}
function toggleFav(id){if(fav.includes(id)){fav=fav.filter(x=>x!==id); showToast("Resep dihapus dari favorit")} else {fav=[...fav,id]; showToast("Resep disimpan ke favorit")} localStorage.setItem("tahoo_fav",JSON.stringify(fav)); render(); if(sel && sel.id===id) updateDetailFav();}
function setPage(p){page=p; kat="Semua"; search=""; searchEl.value=""; render();}
function openDetail(id){sel=allResep.find(r=>r.id===id); tab="bahan"; document.getElementById("detail-img").src=sel.foto; document.getElementById("detail-title").textContent=sel.nama; document.getElementById("detail-badges").innerHTML=`<span style="background:#fff7ed;padding:6px 10px;border-radius:20px;font-size:11px;font-weight:600">⏱️ ${sel.waktu}</span><span style="background:#f0fdf4;padding:6px 10px;border-radius:20px;font-size:11px;font-weight:600">${sel.level}</span><span style="background:#fefce8;padding:6px 10px;border-radius:20px;font-size:11px;font-weight:600">🔥 ${sel.kal} kkal</span>`; updateDetailFav(); setTab("bahan"); popup.classList.add("active");}
function updateDetailFav(){const isFav=fav.includes(sel.id); document.getElementById("detail-fav").innerHTML=`<i class="${isFav?'ri-heart-3-fill':'ri-heart-3-line'}"></i>`; document.getElementById("detail-fav").style.color=isFav?"#ff3b30":"#aaa"; document.getElementById("detail-save").textContent=isFav?"Hapus dari Tersimpan":"❤️ Simpan ke Tersimpan"; document.getElementById("detail-save").style.background=isFav?"#1a1a1a":"#ff7a00";}
function setTab(t){tab=t; document.querySelectorAll(".tab button").forEach(b=>b.classList.remove("active")); document.getElementById("tab-"+t).classList.add("active"); const content=document.getElementById("detail-content"); if(t==="bahan"){content.innerHTML=`<h4>🧂 Bahan</h4><ul style="padding-left:18px;line-height:1.9;margin-top:6px;font-size:14px">${sel.bahan.map(b=>`<li>${b}</li>`).join("")}</ul>${sel.bumbuHalus.length?`<h4 style="margin-top:14px">🌶️ Bumbu Halus</h4><ul style="padding-left:18px;line-height:1.9;margin-top:6px;font-size:14px">${sel.bumbuHalus.map(b=>`<li>${b}</li>`).join("")}</ul>`:""}`;} if(t==="langkah"){content.innerHTML=sel.langkah.map((l,i)=>`<div class="step"><div class="num">${i+1}</div><div style="font-size:14px;line-height:1.5">${l}</div></div>`).join("")} if(t==="tips"){content.innerHTML=`<div style="background:#fffbeb;padding:14px;border-radius:12px;border:1px solid #fde68a;font-size:14px">💡 ${sel.tips}</div>`}}
function closePopup(){popup.classList.remove("active")}
document.getElementById("detail-fav").addEventListener("click",()=>toggleFav(sel.id));
document.getElementById("detail-save").addEventListener("click",()=>toggleFav(sel.id));
popup.addEventListener("click",e=>{if(e.target===popup) closePopup()});
searchEl.addEventListener("input",e=>{search=e.target.value; render()});
function showToast(msg){const t=document.getElementById("toast"); t.textContent=msg; t.style.display="block"; setTimeout(()=>t.style.display="none",2000)}
document.querySelectorAll(".side-item").forEach(item=>{item.addEventListener("click",()=>{const action=item.dataset.action; const katVal=item.dataset.kat; document.querySelectorAll(".side-item").forEach(i=>i.classList.remove("active")); item.classList.add("active"); if(action==="home"){setPage("home")} if(action==="all"){kat="Semua"; page="home"; search=""; searchEl.value=""; render()} if(action==="fav"){setPage("fav")} if(katVal){kat=katVal; page="home"; render()} closeSidebar();});});
renderChips(); render();
</script>
</body>
</html>
